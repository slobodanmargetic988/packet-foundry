[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "packet-foundry-contracts"
version = "0.1.2"
description = "Reusable Packet Foundry contracts service"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/packet_foundry_contracts"]
