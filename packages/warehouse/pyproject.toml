[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packet-foundry-warehouse"
version = "0.1.0"
description = "Reusable Packet Foundry warehouse service"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "packet-foundry-contracts==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/packet_foundry_warehouse"]

[tool.uv.sources]
packet-foundry-contracts = { workspace = true }

[project.scripts]
foundry-warehouse = "packet_foundry_warehouse.cli:main"
