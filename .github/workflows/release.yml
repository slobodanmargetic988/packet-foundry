name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-packages --all-extras --group dev
      - run: uv run --all-packages pytest packages/collector/tests packages/factory/tests -q
      - run: uv build --all-packages
      - run: uv export --frozen --all-packages --all-extras --no-dev --no-emit-workspace --no-hashes --output-file dist/constraints.txt
      - run: uv run --all-packages python scripts/export_schemas.py --output schemas/v1
      - name: Package independently installable wheels
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import shutil
          import zipfile
          output = pathlib.Path('release')
          output.mkdir()
          with zipfile.ZipFile(output / 'packet-foundry-wheels.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted([*pathlib.Path('dist').glob('*.whl'), pathlib.Path('dist/constraints.txt')]):
                  archive.write(path, path.name)
          shutil.make_archive(str(output / 'packet-foundry-schemas'), 'zip', 'schemas')
          shutil.copy('scripts/bootstrap.py', output / 'bootstrap.py')
          files = sorted(output.iterdir())
          (output / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/*
      - name: Publish prerelease assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --prerelease --generate-notes
