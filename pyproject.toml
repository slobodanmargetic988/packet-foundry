[project]
name = "packet-foundry-workspace"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "ruff>=0.11", "build>=1.2", "httpx>=0.28", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
